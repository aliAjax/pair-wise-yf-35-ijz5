<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>反兴奋剂检测与结果管理 · A/B瓶封存演示</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #1f2937; }
    main { max-width: 1080px; margin: auto; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0 2rem; font-size: 14px; }
    th, td { border: 1px solid #d1d5db; padding: 6px 8px; text-align: left; vertical-align: top; }
    th { background: #f3f4f6; }
    pre { background: #f3f4f6; padding: 1rem; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; }
    button { padding: .5rem .8rem; cursor: pointer; margin: 0 .5rem .5rem 0; }
    .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; }
    .sealed { background: #dcfce7; color: #166534; }
    .opened { background: #fee2e2; color: #991b1b; }
    .unregistered { background: #e5e7eb; color: #374151; }
    .missing { color: #b45309; }
    .muted { color: #6b7280; }
  </style>
</head>
<body>
<main>
  <h1>反兴奋剂检测与结果管理</h1>
  <p>双瓶（A/B）封存演示：封存时分别登记 A、B 瓶封条号；实验室日常检测只启封 A 瓶；
     A 瓶异常后管理员可发起 B 瓶复检，B 瓶须两名见证人登记完整后才能启封，手续不全则保持封存并提示缺少项；
     A 瓶正常时 B 瓶继续封存。所有启封记录保留瓶号、时间、经办人和见证人。</p>
  <p>
    <button onclick="checkHealth()">检查服务状态</button>
    <button onclick="loadAll()">刷新双瓶状态</button>
  </p>
  <p>
    <button onclick="seedAdverse()">演示：A瓶异常 → B瓶复检全流程</button>
    <button onclick="seedCleared()">演示：A瓶正常（B瓶继续封存）</button>
    <button onclick="seedIncomplete()">演示：手续不全无法启封B瓶</button>
  </p>
  <pre id="result">等待操作</pre>
  <h2>样本双瓶状态</h2>
  <div id="samples" class="muted">暂无数据</div>
  <h2>启封记录</h2>
  <div id="records" class="muted">暂无数据</div>
</main>
<script>
const SAMPLE_STATUS = {
  scheduled: '待采样', collected: '已采集', sealed: '已封存', in_transit: '运输中',
  received: '实验室已接收', analyzed: '已检测', adverse: 'A瓶结果异常',
  cleared: 'A瓶正常已结案', b_retest_pending: 'B瓶复检待启封',
  b_opened: 'B瓶已启封', b_closed: 'B瓶复检完成'
};
const BOTTLE_STATUS = { sealed: '封存中', opened: '已启封', unregistered: '未登记' };

function esc(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function show(message) {
  document.getElementById('result').textContent = message;
}

async function api(path, opts = {}) {
  opts.headers = Object.assign(
    { 'Content-Type': 'application/json', 'X-User-Id': 'demo-admin', 'X-Role': 'admin' },
    opts.headers || {}
  );
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

const post = (path, data) => api(path, { method: 'POST', body: JSON.stringify(data || {}) });

function act(id, action, data, role) {
  const headers = role ? { 'X-User-Id': role + '-1', 'X-Role': role } : {};
  return api('/api/entities/' + id + '/actions', {
    method: 'POST', headers, body: JSON.stringify({ action, data: data || {} })
  });
}

async function checkHealth() {
  const res = await fetch('/health');
  show(JSON.stringify(await res.json(), null, 2));
}

async function seedBase(stamp) {
  const athlete = await post('/api/athletes', { name: '演示运动员' + stamp, discipline: 'cycling' });
  const sample = await post('/api/samples', { athlete_id: athlete.id, sample_code: 'S-' + stamp, event: 'demo-event' });
  await act(sample.id, 'collect', { collected_at: new Date().toISOString() });
  await act(sample.id, 'seal', { seal_a: 'SEAL-A-' + stamp, seal_b: 'SEAL-B-' + stamp });
  await act(sample.id, 'ship', { carrier: 'Courier-A' });
  await act(sample.id, 'receive', { lab_id: 'LAB-1' });
  return sample;
}

async function seedAdverse() {
  try {
    const stamp = Date.now();
    const sample = await seedBase(stamp);
    await act(sample.id, 'analyze', { result: 'adverse' }, 'lab');
    await act(sample.id, 'report_adverse', {}, 'lab');
    await act(sample.id, 'request_b_retest', { reason: 'A瓶结果异常，申请B瓶复检' });
    await act(sample.id, 'register_witness', { witness: '见证人甲' });
    await act(sample.id, 'register_witness', { witness: '见证人乙' });
    await act(sample.id, 'open_b', {});
    await act(sample.id, 'record_b_result', { b_result: 'confirmed' }, 'lab');
    show('演示数据已生成（A瓶异常 → B瓶复检完成），样本: ' + sample.id);
  } catch (e) { show('生成失败: ' + e.message); }
  loadAll();
}

async function seedCleared() {
  try {
    const stamp = Date.now();
    const sample = await seedBase(stamp);
    await act(sample.id, 'analyze', { result: 'negative' }, 'lab');
    await act(sample.id, 'clear', { reason: 'A瓶结果正常' }, 'lab');
    show('演示数据已生成（A瓶正常，B瓶继续封存），样本: ' + sample.id);
  } catch (e) { show('生成失败: ' + e.message); }
  loadAll();
}

async function seedIncomplete() {
  try {
    const stamp = Date.now();
    const sample = await seedBase(stamp);
    await act(sample.id, 'analyze', { result: 'adverse' }, 'lab');
    await act(sample.id, 'report_adverse', {}, 'lab');
    await act(sample.id, 'request_b_retest', { reason: 'A瓶结果异常，申请B瓶复检' });
    await act(sample.id, 'register_witness', { witness: '见证人甲' });
    try {
      await act(sample.id, 'open_b', {});
      show('异常：手续不全却启封成功');
    } catch (e) {
      show('B瓶保持封存，服务器返回：' + e.message + '（样本: ' + sample.id + '）');
    }
  } catch (e) { show('生成失败: ' + e.message); }
  loadAll();
}

function bottleCell(label, info, retest) {
  const status = info.status || 'unregistered';
  let html = '<span class="tag ' + status + '">' + label + '瓶 · ' + (BOTTLE_STATUS[status] || status) + '</span>';
  if (info.seal_id) html += '<br>封条号: ' + esc(info.seal_id);
  if (info.opened_at) html += '<br>启封: ' + esc(info.opened_at) + ' / 经办人 ' + esc(info.opened_by);
  if (info.witnesses && info.witnesses.length) html += '<br>见证人: ' + info.witnesses.map(esc).join('、');
  if (retest) {
    html += '<br>复检发起: ' + esc(retest.requested_at) + ' / ' + esc(retest.requested_by);
    html += '<br>见证人登记: ' + (retest.witnesses || []).map(esc).join('、') +
            '（' + (retest.witnesses || []).length + '/2）';
  }
  if (info.missing && info.missing.length) html += '<br><span class="missing">缺少: ' + info.missing.map(esc).join('；') + '</span>';
  if (info.note) html += '<br><span class="muted">' + esc(info.note) + '</span>';
  return html;
}

async function loadAll() {
  const data = await api('/api/samples');
  const items = data.items || [];
  const sampleDiv = document.getElementById('samples');
  const recordDiv = document.getElementById('records');
  if (!items.length) {
    sampleDiv.textContent = '暂无数据';
    recordDiv.textContent = '暂无数据';
    return;
  }
  let rows = '';
  let records = '';
  for (const sample of items) {
    const view = sample.bottle_view || {};
    rows += '<tr><td>' + esc(sample.data.sample_code || sample.id) + '</td>' +
      '<td>' + esc(SAMPLE_STATUS[sample.status] || sample.status) + '</td>' +
      '<td>' + bottleCell('A', view.a || {}) + '</td>' +
      '<td>' + bottleCell('B', view.b || {}, view.b_retest) + '</td></tr>';
    for (const rec of (view.unseal_records || [])) {
      records += '<tr><td>' + esc(sample.data.sample_code || sample.id) + '</td>' +
        '<td>' + esc(rec.bottle) + '瓶</td>' +
        '<td>' + esc(rec.seal_id) + '</td>' +
        '<td>' + esc(rec.opened_at) + '</td>' +
        '<td>' + esc(rec.opened_by) + '</td>' +
        '<td>' + esc((rec.witnesses || []).join('、') || '—') + '</td>' +
        '<td>' + esc(rec.purpose || '') + '</td></tr>';
    }
  }
  sampleDiv.innerHTML = '<table><tr><th>样本编号</th><th>样本状态</th><th>A瓶</th><th>B瓶</th></tr>' + rows + '</table>';
  recordDiv.innerHTML = records
    ? '<table><tr><th>样本编号</th><th>瓶号</th><th>封条号</th><th>启封时间</th><th>经办人</th><th>见证人</th><th>用途</th></tr>' + records + '</table>'
    : '暂无启封记录';
}

loadAll();
</script>
</body>
</html>
